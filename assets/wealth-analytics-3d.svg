<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Wealth Management Analytics — 3D Data Pipeline</title>
<desc id="desc">An isometric neon dashboard showing financial data moving from source files through Databricks and Delta Lake into Data Marts, Power BI, REST APIs and AI reports.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D1B"/><stop offset=".55" stop-color="#111B36"/><stop offset="1" stop-color="#24103F"/></linearGradient>
  <linearGradient id="top1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
  <linearGradient id="top2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06B6D4"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
  <linearGradient id="top3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EC4899"/><stop offset="1" stop-color="#9333EA"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182746"/><stop offset="1" stop-color="#0A1226"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7C8DB5" stroke-opacity=".12"/></pattern>
</defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/><rect width="1200" height="700" rx="28" fill="url(#grid)"/>
<circle cx="1030" cy="100" r="130" fill="#7C3AED" opacity=".10"/><circle cx="150" cy="600" r="150" fill="#06B6D4" opacity=".08"/>
<text x="60" y="70" fill="#A5B4FC" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">END-TO-END DATA PLATFORM</text>
<text x="60" y="116" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="35" font-weight="700">WEALTH MANAGEMENT ANALYTICS</text>
<text x="60" y="148" fill="#A8B5D4" font-family="Arial,sans-serif" font-size="17">Raw financial data → engineered pipelines → decision-ready intelligence</text>
<!-- connector paths -->
<g fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8" filter="url(#glow)" opacity=".9">
<path d="M230 300 L310 300"/><path d="M480 300 L560 300"/><path d="M730 300 L810 300"/><path d="M900 390 L900 455"/>
</g>
<g fill="#67E8F9"><path d="M302 292l12 8-12 8z"/><path d="M552 292l12 8-12 8z"/><path d="M802 292l12 8-12 8z"/><path d="M892 447l8 12 8-12z"/></g>
<!-- Source block -->
<g transform="translate(65 235)">
<polygon points="0,45 82,0 164,45 82,90" fill="#1D3558" stroke="#67E8F9" stroke-opacity=".8"/>
<polygon points="0,45 82,90 82,180 0,135" fill="#10233F" stroke="#67E8F9" stroke-opacity=".5"/>
<polygon points="82,90 164,45 164,135 82,180" fill="#0B1930" stroke="#67E8F9" stroke-opacity=".5"/>
