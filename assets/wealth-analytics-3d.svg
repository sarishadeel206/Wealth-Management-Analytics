<text x="82" y="212" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="18" font-weight="700">PROCESS</text><text x="82" y="237" text-anchor="middle" fill="#C4B5FD" font-family="Arial,sans-serif" font-size="14">Databricks · PySpark</text>
</g>
<!-- Warehouse block -->
<g transform="translate(565 235)">
