<text x="60" y="655" fill="#8FA4C9" font-family="Arial,sans-serif" font-size="14">DATA ENGINEERING  •  FINANCIAL ANALYTICS  •  AI-ASSISTED REPORTING</text>
<text x="1135" y="655" text-anchor="end" fill="#C4B5FD" font-family="Arial,sans-serif" font-size="14">BUILT BY SARISH ADEEL</text>
