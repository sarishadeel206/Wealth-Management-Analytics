<path d="M25 85V72h12v13M45 85V60h12v25M65 85V48h12v37M85 85V66h12v19" fill="#38BDF8" opacity=".9"/>
<path d="M120 80l20-15 19 6 26-25" fill="none" stroke="#A78BFA" stroke-width="3"/><circle cx="185" cy="46" r="4" fill="#A78BFA"/>
</g>
<g transform="translate(620 500)">
<rect x="0" y="12" width="230" height="105" rx="12" fill="#071126" stroke="#F472B6" stroke-opacity=".8" stroke-width="2"/>
<rect x="0" y="0" width="230" height="105" rx="12" fill="#20142F" stroke="#F472B6" stroke-width="1.5"/>
<text x="20" y="29" fill="#F9A8D4" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">02 / GENERATE</text><text x="20" y="55" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="19" font-weight="700">AI Portfolio Reports</text>
<path d="M22 72h180M22 82h145M22 92h160" stroke="#F9A8D4" stroke-width="4" stroke-linecap="round" opacity=".7"/>
