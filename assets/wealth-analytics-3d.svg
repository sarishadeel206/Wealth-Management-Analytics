<text x="82" y="212" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="18" font-weight="700">MODEL</text><text x="82" y="237" text-anchor="middle" fill="#A5F3FC" font-family="Arial,sans-serif" font-size="14">Delta Lake · Facts</text>
</g>
<!-- Serving block -->
<g transform="translate(815 235)">
<polygon points="0,45 82,0 164,45 82,90" fill="url(#top3)" stroke="#FBCFE8" stroke-width="1.5"/>
<polygon points="0,45 82,90 82,180 0,135" fill="#5B205D" stroke="#F472B6"/>
<polygon points="82,90 164,45 164,135 82,180" fill="#341644" stroke="#F472B6"/>
<g fill="none" stroke="#FCE7F3" stroke-width="3"><path d="M47 28h70v43H47z"/><path d="M47 40h70M60 28v43M83 28v43M105 28v43"/></g>
